# Specifies the JVM arguments used for the daemon process.
# Adjusted to 2GB to safely fit within the standard GitHub Actions runner memory limits.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8

# Run tasks in parallel where decoupled
org.gradle.parallel=true
org.gradle.workers.max=2

# Keep build caching on, but turn off configuration-caching on CI.
# Configuration caching often causes Process Exit Code 1 on headless machines if plugins mismatch.
org.gradle.caching=true
org.gradle.configuration-cache=false

# Kotlin code style
kotlin.code.style=official
android.nonTransitiveRClass=true

# Keep the compiler process clean and lightweight inside the runner container
kotlin.compiler.execution.strategy=in-process
googleServices.missing.passthrough=true
