name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 🔹 Configures Gradle 8.2 globally on the cloud runner to bypass the missing local wrapper
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'
          cache-cleanup: 'always' # Optimized cleanup for pipeline storage

      # 🔹 Runs the build step natively as recommended by the Gradle upgrade guide
      - name: Build debug APK with Gradle
        run: gradle assembleDebug

      - name: Upload Compiled APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: |
            **/build/outputs/apk/debug/*-debug.apk
