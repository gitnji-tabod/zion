name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Set up JDK 17
        uses: actions/setup-java@v4.5.0
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        # ⚠️ Replace YOUR_APP_FOLDER_NAME with your actual subfolder name
        working-directory: ./zion 
        run: chmod +x gradlew

      - name: Build debug APK with Gradle
        # ⚠️ Replace YOUR_APP_FOLDER_NAME with your actual subfolder name
        working-directory: ./zion 
        run: ./gradlew assembleDebug

      # This step uploads your compiled APK so you can download it from GitHub
      - name: Upload Compiled APK
        if: success()
        uses: actions/upload-artifact@v4.6.0
        with:
          name: app-debug-apk
          # ⚠️ Ensure this path matches where your app builds the APK inside that folder
          path: ./zion/app/build/outputs/apk/debug/app-debug.apk
