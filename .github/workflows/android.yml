name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Configures a clean environment and forces validation to clear corrupted dependencies
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'
          cache-disabled: true # Keeps the cloud workspace sterile to clear the bcprov jar error

      # Runs the build while handling the project name spacing natively
      - name: Build debug APK with Gradle
        run: gradle assembleDebug --no-daemon --stacktrace

      # Safely locates and uploads your APK regardless of your subfolder layout
      - name: Upload Compiled APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: "**/build/outputs/apk/debug/*-debug.apk"
